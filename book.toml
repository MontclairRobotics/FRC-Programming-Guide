[book]
authors = ["James 2539", "Abraham 555", "Connor 555"]
language = "en"
multilingual = false
src = "src"
title = "Montclair Robotics Programming"

[preprocessor.theme]
pagetoc = true
sidebar-width = "250px"

[output.html]
default-theme = "navy"
git-repository-url = "https://github.com/MontclairRobotics/FRC-Programming-Guide"
git-repository-icon = "fa-github"
additional-css = ["theme/pagetoc.css"]
additional-js = ["theme/pagetoc.js", "theme/rnasir.js"]
site-url = "/FRC-Programming-Guide/"
edit-url-template = "https://github.com/MontclairRobotics/FRC-Programming-Guide/edit/main/{path}"
smart-punctuation = true

[output.html.fold]
enable = false
level = 1

[output.html.playground]
editable = true
copyable = true
copy-js = true
line-numbers = true
runnable = true

[output.html.search]
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 2

[output.html.print]
enable = false

[output.theme-ace]
theme-white = "xcode"
theme-dark = "monokai"
optional = true