[book]
authors = ["James 555, Abraham 555"]
language = "zh"
multilingual = false
src = "src"
title = "Montclair Robotics Programming"

[preprocessor.theme]
pagetoc = true
sidebar-width = "250px"

[output.html]
default-theme = "ayu"
git-repository-url = "https://github.com/MontclairRobotics/FRC-Programming-Guide"
git-repository-icon = "fa-github"
additional-css = ["theme/pagetoc.css"]
additional-js = ["theme/pagetoc.js"]

[output.html.fold]
enable = false
level = 1

[output.html.playground]
editable = true
copyable = true
copy-js = true
line-numbers = false
runnable = true

[output.html.print]
enable = false

[output.theme-ace]
theme-white = "xcode"
theme-dark = "monokai"
